<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pinball Pit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%237ae582'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070814; overflow: hidden; }
  body {
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  #stage {
    position: relative;
    width: min(100vw, 1080px, calc(100dvh * 1.05));
    height: 100dvh;
    background: #12152b;
    overflow: hidden;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(6, 8, 20, .62);
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  h1 {
    margin: 0;
    color: #f4f7ff;
    font-size: clamp(40px, 9vw, 58px);
    letter-spacing: .06em;
    text-shadow: 0 0 18px rgba(120, 180, 255, .8);
  }
  .overlay p { margin: 0; color: #d5def5; font-size: 20px; font-weight: 700; }
  button.play {
    font: inherit;
    font-size: 28px;
    font-weight: 700;
    color: #081018;
    background: #7ae582;
    border: 0;
    border-radius: 999px;
    padding: 14px 46px;
    cursor: pointer;
    box-shadow: 0 6px 0 #2d8a4a;
  }
  button.play:active { transform: translateY(3px); box-shadow: 0 3px 0 #2d8a4a; }
  .kicker { letter-spacing: .16em; font-size: 13px; color: #9eb0d6; }
  .cards { width: min(86%, 520px); display: flex; flex-direction: column; gap: 10px; }
  button.card {
    font: inherit;
    text-align: left;
    color: #f7f8ff;
    background: #1c2244;
    border: 2px solid rgba(255,255,255,.16);
    border-radius: 16px;
    padding: 12px 14px;
    cursor: pointer;
  }
  button.card strong { display: block; font-size: 18px; margin-bottom: 4px; }
  button.card span { display: block; font-size: 14px; color: #c5d0ea; font-weight: 500; }
  button.card.selected { border-color: #ffb703; box-shadow: 0 0 0 3px rgba(255,183,3,.25); }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="start" class="overlay">
      <h1>PINBALL PIT</h1>
      <button type="button" class="play" id="startBtn">Start</button>
    </div>
    <div id="cards" class="overlay hidden">
      <p class="kicker">UPGRADE</p>
      <div class="cards">
        <button type="button" class="card" data-i="0"><strong></strong><span></span></button>
        <button type="button" class="card" data-i="1"><strong></strong><span></span></button>
        <button type="button" class="card" data-i="2"><strong></strong><span></span></button>
      </div>
    </div>
    <div id="over" class="overlay hidden">
      <h1>PIT</h1>
      <p id="finalScore">0</p>
      <button type="button" class="play" id="retryBtn">Restart</button>
    </div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
